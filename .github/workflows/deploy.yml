name: Deploy to GitHub Pages

# Manual-only. This used to also trigger on every push to main, which meant
# every production deploy silently published a second, Supabase-less
# "fallback" copy of the site at this repo's github.io URL alongside the
# real napeandsonsplumbing.co.za deployment on Netlify — duplicate content
# competing with the canonical domain. The custom domain is the only
# canonical public site; run this manually (Actions tab → this workflow →
# "Run workflow") only if GitHub Pages is deliberately needed again.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # No Supabase secrets are set here on purpose. The public site
          # falls back to local project data/images when they're absent.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
