<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F33" />
    <!-- Title only — no static meta description here. Every route sets its
         own via the Seo component (src/components/Seo.jsx / react-helmet-async).
         A static description here would sit alongside Helmet's version
         instead of being replaced by it (Helmet only manages tags it renders
         itself), producing a duplicate <meta name="description"> in the DOM. -->
    <title>Nape and Sons Plumbing & Projects | Plumber Limpopo, Pretoria & Johannesburg</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-offwhite text-ink font-body antialiased">
    <div id="root"></div>
    <script>
      // Restores the real path after the GitHub Pages 404.html SPA redirect
      // (see public/404.html). No-op on hosts with proper SPA rewrites.
      (function () {
        var params = new URLSearchParams(location.search)
        var redirect = params.get('redirect')
        if (redirect) {
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
